<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0e16">
  <title>Интегралдық шахмат · МЕК</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1522'/%3E%3Ctext x='32' y='47' font-size='44' text-anchor='middle' fill='%23f3c969' font-family='serif' font-style='italic'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Общие градиенты для фишек -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="wBase" cx="40%" cy="35%" r="75%">
        <stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#e9dcc2"/><stop offset="1" stop-color="#b9a47c"/>
      </radialGradient>
      <linearGradient id="wRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe39a"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5f1c"/>
      </linearGradient>
      <radialGradient id="wHead" cx="38%" cy="32%" r="80%">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f1e6cf"/><stop offset="1" stop-color="#c8b28a"/>
      </radialGradient>
      <radialGradient id="bBase" cx="40%" cy="35%" r="75%">
        <stop offset="0" stop-color="#4a5569"/><stop offset=".6" stop-color="#262d3b"/><stop offset="1" stop-color="#11151d"/>
      </radialGradient>
      <linearGradient id="bRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#bfeaff"/><stop offset=".5" stop-color="#4fb3ec"/><stop offset="1" stop-color="#1d4f77"/>
      </linearGradient>
      <radialGradient id="bHead" cx="38%" cy="32%" r="80%">
        <stop offset="0" stop-color="#6b7790"/><stop offset=".55" stop-color="#2e3647"/><stop offset="1" stop-color="#151a24"/>
      </radialGradient>
    </defs>
  </svg>

  <div id="bg" aria-hidden="true"></div>

  <!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
  <section id="screen-menu" class="screen active">
    <div class="menu-wrap">
      <div class="menu-hero">
        <div class="hero-mark" aria-hidden="true">
          <span class="hero-int">∫</span>
          <span class="hero-orbit"></span>
        </div>
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 class="title"><span class="t1" data-i18n="title_1"></span><br><span class="t2" data-i18n="title_2"></span></h1>
        <p class="lead" data-i18n-html="lead_html"></p>
      </div>

      <div class="menu-card">
        <div class="players">
          <label class="player-input w">
            <span class="pi-side"><i class="chip w"></i><span data-i18n="side_w"></span></span>
            <input id="name-w" maxlength="18" autocomplete="off" spellcheck="false">
          </label>
          <span class="vs-small">VS</span>
          <label class="player-input b">
            <span class="pi-side"><i class="chip b"></i><span data-i18n="side_b"></span></span>
            <input id="name-b" maxlength="18" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <div class="settings">
          <div class="set-row">
            <span class="set-label" data-i18n="set_lang"></span>
            <div class="seg" id="set-lang" role="radiogroup">
              <button data-v="kk">Қазақша</button><button data-v="ru">Русский</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label" data-i18n="set_time"></span>
            <div class="seg" id="set-time" role="radiogroup">
              <button data-v="10">10с</button><button data-v="15">15с</button><button data-v="20">20с</button><button data-v="30">30с</button><button data-v="45">45с</button><button data-v="60">60с</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label" data-i18n="set_diff"></span>
            <div class="seg" id="set-diff" role="radiogroup">
              <button data-v="easy" data-i18n="diff_easy"></button><button data-v="medium" data-i18n="diff_medium"></button><button data-v="hard" data-i18n="diff_hard"></button><button data-v="mix" data-i18n="diff_mix"></button>
            </div>
          </div>
          <div class="set-row inline">
            <span class="set-label"><span data-i18n="set_diag"></span><small data-i18n="set_diag_sub"></small></span>
            <button class="switch" id="set-diag" role="switch" aria-checked="true"><i></i></button>
          </div>
          <div class="set-row inline">
            <span class="set-label" data-i18n="set_sound"></span>
            <button class="switch" id="set-sound" role="switch" aria-checked="true"><i></i></button>
          </div>
        </div>

        <div class="menu-actions">
          <button class="btn primary big" id="btn-new">
            <svg viewBox="0 0 24 24" class="ic"><path d="M7 4l12 8-12 8z"/></svg><span data-i18n="btn_new"></span>
          </button>
          <button class="btn ghost big hidden" id="btn-continue"></button>
          <button class="btn ghost" id="btn-rules" data-i18n="btn_rules"></button>
        </div>
      </div>
    </div>
    <footer class="menu-foot" data-i18n-html="menu_foot_html"></footer>
  </section>

  <!-- ============ ИГРА ============ -->
  <section id="screen-game" class="screen">
    <header class="topbar">
      <div class="brand"><span class="brand-int">∫</span><span class="brand-txt" data-i18n="brand"></span></div>
      <div class="turn-ind" id="turn-ind">
        <span class="score-pill"><b class="w" id="score-w">0</b><i>:</i><b class="b" id="score-b">0</b></span>
        <span class="turn-dot"></span>
        <span class="turn-text" id="turn-text"></span>
        <span class="turn-no" id="turn-no"></span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-sound" data-i18n-title="t_sound"></button>
        <button class="icon-btn" id="btn-help" data-i18n-title="t_help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2.9-1.2 1.8v.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-menu" data-i18n-title="t_menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <div class="area-bcard player-card b" id="card-b"></div>

      <div class="area-board board-area">
        <div class="board-frame" id="board-frame">
          <div class="goal-tag top"><span data-i18n="goal_w"></span></div>
          <div class="coords files top" id="files-top"></div>
          <div class="coords files bottom" id="files-bottom"></div>
          <div class="coords ranks left" id="ranks-left"></div>
          <div class="coords ranks right" id="ranks-right"></div>
          <div class="board" id="board">
            <div class="cells" id="cells"></div>
            <div class="pieces" id="pieces"></div>
            <div class="fx" id="fx"></div>
          </div>
          <div class="goal-tag bottom"><span data-i18n="goal_b"></span></div>
        </div>
      </div>

      <div class="area-wcard player-card w" id="card-w"></div>

      <div class="area-info side-card" id="pawn-info"></div>

      <div class="area-log side-card log-card">
        <div class="card-head"><h3 data-i18n="log_title"></h3><span class="muted" id="log-count"></span></div>
        <ol class="log" id="log"></ol>
      </div>
    </main>
  </section>

  <!-- ============ БИТВА ============ -->
  <div class="overlay battle hidden" id="battle" aria-live="polite">
    <div class="battle-top">
      <div class="bt-title"><span class="bt-swords">⚔</span> <span data-i18n="battle"></span> <span class="bt-round" id="b-round"></span></div>
      <div class="bt-sub" id="b-sub"></div>
    </div>
    <div class="battle-grid">
      <div class="duel-panel w" id="panel-w"></div>
      <div class="battle-center">
        <div class="timer" id="b-timer">
          <svg viewBox="0 0 100 100"><circle class="tr-bg" cx="50" cy="50" r="44"/><circle class="tr-fg" id="b-ring" cx="50" cy="50" r="44"/></svg>
          <div class="timer-num"><span id="b-time">20</span><small data-i18n="sec"></small></div>
        </div>
        <div class="bc-level" id="b-level"></div>
        <div class="bc-rule" data-i18n="rule_line"></div>
      </div>
      <div class="duel-panel b" id="panel-b"></div>
    </div>
    <div class="battle-banner hidden" id="b-banner"></div>
    <div class="countdown hidden" id="b-count"></div>
  </div>

  <!-- ============ ПОБЕДА ============ -->
  <div class="overlay victory hidden" id="victory">
    <canvas id="confetti"></canvas>
    <div class="victory-card" id="victory-card"></div>
  </div>

  <!-- ============ МОДАЛЬНЫЕ ============ -->
  <div class="overlay modal hidden" id="modal-rules">
    <div class="modal-card rules">
      <button class="modal-close" data-close aria-label="Закрыть">×</button>
      <h2 data-i18n="rules_title"></h2>
      <ol class="rules-list" data-i18n-html="rules_html"></ol>
      <h3 data-i18n="controls_title"></h3>
      <div class="controls-grid">
        <div class="ctrl w" data-i18n-html="ctrl_w_html"></div>
        <div class="ctrl b" data-i18n-html="ctrl_b_html"></div>
      </div>
      <p class="muted small" data-i18n="rules_note"></p>
    </div>
  </div>

  <div class="overlay modal hidden" id="modal-menu">
    <div class="modal-card small-card">
      <button class="modal-close" data-close aria-label="Закрыть">×</button>
      <h2 data-i18n="pause"></h2>
      <p class="muted" data-i18n="pause_sub"></p>
      <div class="modal-actions">
        <button class="btn primary" data-close data-i18n="back_game"></button>
        <button class="btn ghost" id="btn-restart" data-i18n="restart"></button>
        <button class="btn ghost" id="btn-to-menu" data-i18n="exit_menu"></button>
        <button class="btn ghost" id="btn-end" data-i18n="end_count"></button>
        <button class="btn danger" id="btn-resign" data-i18n="resign"></button>
      </div>
    </div>
  </div>

  <div class="turn-banner hidden" id="turn-banner"></div>
  <div class="toasts" id="toasts"></div>

  <script src="assets/katex/katex.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/integrals.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
